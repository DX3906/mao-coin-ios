name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Download source (no checkout action needed)
        run: |
          curl -fsSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/tarball/${{ github.sha }}" -o src.tgz
          tar xzf src.tgz --strip-components=1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Build for simulator (compile check, unsigned)
        run: |
          xcodebuild build \
            -project CoinFlip.xcodeproj \
            -scheme CoinFlip \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive unsigned build for device
        run: |
          xcodebuild archive \
            -project CoinFlip.xcodeproj \
            -scheme CoinFlip \
            -destination 'generic/platform=iOS' \
            -archivePath build/CoinFlip.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/CoinFlip.xcarchive/Products/Applications/CoinFlip.app" build/Payload/
          cd build && zip -qr CoinFlip-unsigned.ipa Payload

      - name: Publish IPA to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build
          gh release delete ipa -y || true
          gh release create ipa CoinFlip-unsigned.ipa -t "IPA" -n "unsigned IPA, install via AltStore"
